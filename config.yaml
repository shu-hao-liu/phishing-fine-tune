model:
  # Hugging Face repository ID/URL, local:Model-1, or /workspace/fine-tuned-weights/Model-1
  source: FacebookAI/xlm-roberta-base
  task: auto  # auto, classification, causal_lm, or seq2seq
  trust_remote_code: false  # Only enable for repositories whose code you trust.
  revision: main  # Pin a commit hash for reproducible runs.
  cache_dir: /tmp/phishing-detect-hf-cache  # Pod-local disk, not /workspace.
data:
  train_csv: training.csv  # Upload this file to the project folder.
  inference_csv: /workspace/phishing-data/inference/inference.csv
  eval_csv: null  # Optional separate labeled CSV; never used for training.
  text_column: text
  label_column: label
  positive_label: phishing
  max_length: 512
training:
  output_model_name: Original  # Saved under /workspace/fine-tuned-weights; must not already exist.
  epochs: 3
  learning_rate: 0.00002
  batch_size: 8
  gradient_accumulation_steps: 1
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42
  precision: fp32  # fp32, fp16, or bf16 (mixed precision requires CUDA)
inference:
  task: auto  # auto, classification, causal_lm, or seq2seq
  trust_remote_code: false
  # Inference model: HF repository ID/URL, local:Model-1, or /workspace/fine-tuned-weights/Model-1.
  # Leave null and set model_dir below to use an existing local model.
  model_source: local:Original
  model_revision: main
  positive_label_index: null  # Optional 0 or 1 when model labels do not name the positive class.
  model_dir: null  # Set to the fine-tuned model directory.
  batch_size: 16
  threshold: 0.5  # Classifier probability threshold.
  max_new_tokens: 32
  do_sample: false
  temperature: 0.7  # Used only when do_sample is true.
  top_p: 0.9
# Shared prompt used for language-model fine-tuning and inference.
generation:
  prompt_template: "Classify the following text as phishing or legitimate.\nText: {text}\nLabel:"
output_dir: /workspace/phishing-detect-output

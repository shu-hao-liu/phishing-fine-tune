train:
  model_source: FacebookAI/xlm-roberta-base
  model_revision: main
  task: auto
  trust_remote_code: false
  cache_dir: /tmp/phishing-detect-hf-cache
  output_model_name: Original
  epochs: 3
  learning_rate: 2.0e-05
  batch_size: 16
  gradient_accumulation_steps: 1
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42
  precision: auto
  output_dir: /workspace/phishing-detect-output
  progress_every: 50
data:
  train_csv: train.csv
  inference_csv: /workspace/phishing-data/inference/inference.csv
  eval_csv: null
  text_column: body
  label_column: label
  positive_label: '1.0'
  max_length: 512
  prompt_template: 'Classify the following text as phishing or legitimate.

    Text: {text}

    Label:'
inference:
  cache_dir: /tmp/phishing-detect-hf-cache
  task: auto
  trust_remote_code: false
  model_source: local:Original
  model_revision: main
  positive_label_index: null
  model_dir: null
  batch_size: 32
  threshold: 0.5
  max_new_tokens: 32
  do_sample: false
  temperature: 0.7
  top_p: 0.9
  output_dir: /workspace/phishing-detect-output

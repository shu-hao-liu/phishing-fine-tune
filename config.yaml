train:
  model_source: FacebookAI/xlm-roberta-base
  model_revision: main
  task: auto
  trust_remote_code: false
  output_model_name: Original
  resume_from: null
  epochs: 3
  learning_rate: 2.0e-05
  batch_size: 32
  gradient_accumulation_steps: 1
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42
  precision: auto
  lora:
    enabled: false
    rank: 8
    alpha: 16
    dropout: 0.05
    target_modules: null  # null uses PEFT defaults for supported models
  progress_every: 50
  text_column: body
  label_column: label
  positive_label: '1.0'
  max_length: 512

validate:
  threshold: 0.5

test:
  model_source: local:Original
  model_revision: main
  task: auto
  trust_remote_code: false
  positive_label_index: null
  checkpoint: null
  batch_size: 32
  threshold: 0.5
  max_new_tokens: 32
  do_sample: false
  temperature: 0.1
  top_p: 0.9
